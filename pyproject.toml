[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus-enterprise-agent"
version = "0.2.2"
description = "Enterprise-ready, SaaS-native Python multi-agent framework"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Nexus Team"}
]
requires-python = ">=3.10"
keywords = ["agents", "llm", "multi-agent", "saas", "orchestration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "tiktoken>=0.7",
    "jinja2>=3.1",
    "anyio>=4.0",
    "tenacity>=8.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/gowrav-vishwakarma/nexus-enterprise-agent"
Repository = "https://github.com/gowrav-vishwakarma/nexus-enterprise-agent"
Documentation = "https://github.com/gowrav-vishwakarma/nexus-enterprise-agent/tree/main/docs"

[project.optional-dependencies]
# Storage adapters
sqlite = ["aiosqlite>=0.20", "filelock>=3.13"]
postgres = ["asyncpg>=0.29", "alembic>=1.13"]
redis = ['redis>=5.0', 'hiredis']
file = ["filelock>=3.13"]

# LLM provider clients
openai = ["openai>=1.30"]
anthropic = ["anthropic>=0.28"]
gemini = ["google-genai>=1.0"]
litellm = ["litellm>=1.40"]
groq = ["groq>=0.9"]
ollama = ["ollama>=0.2"]

# Observability
otel = [
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp>=1.24",
]

# FastAPI integration
fastapi = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "websockets>=12",
    "sse-starlette>=2.1",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
]

# Realtime / voice / channels (transports + media providers are optional)
realtime = [
    "websockets>=12",
    "httpx>=0.27",
]

# gRPC client for Nexus media servers (lightweight — no torch)
grpc = [
    "grpcio>=1.60",
    "grpcio-tools>=1.60",
    "protobuf>=5.26",
    "numpy>=1.26",
]

# Nexus media model servers (GPU engines — heavy).
# NOTE: the Indic Parler TTS engine is NOT listed here on purpose. parler-tts
# depends (transitively) on protobuf<5, which is incompatible with the gRPC
# stubs (protobuf>=5). Install it separately AFTER syncing, then repin protobuf:
#   uv pip install parler-tts
#   uv pip install "protobuf>=5.26"
# Model weights (ai4bharat/indic-parler-tts) download automatically on first use.
server = [
    "nexus-enterprise-agent[grpc]",
    "torch>=2.0",
    "torchaudio>=2.0",
    "numpy>=1.26",
    "transformers>=4.46",
    "faster-whisper>=1.0",
    "onnxruntime>=1.17",
]

# Kyutai Moshi speech-to-speech client (the MODEL runs in a separate server).
moshi = [
    "websockets>=12",
    "sphn>=0.1.4",
    "numpy>=1.26",
]

# All dependencies
all = [
    "nexus-enterprise-agent[sqlite,postgres,file,openai,anthropic,gemini,litellm,groq,ollama,otel,fastapi,realtime,moshi,grpc]",
]

# Full test suite (all adapters + storage + FastAPI + gRPC)
test = [
    "nexus-enterprise-agent[dev,litellm,openai,anthropic,sqlite,postgres,redis,file,fastapi,grpc]",
]

# Dev / integration-test dependencies
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "respx>=0.21",
    "faker>=25.0",
    "coverage>=7.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "filelock>=3.13",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "redis>=5.0",
    "hiredis>=3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["nexus"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not live_llm'"
filterwarnings = [
    "ignore:datetime\\.datetime\\.utcnow\\(\\) is deprecated:DeprecationWarning:pydantic\\.main",
    "ignore:Using `httpx` with `starlette\\.testclient` is deprecated",
]
markers = [
    "live_llm: real LLM API calls; opt-in only (pytest -m live_llm)",
    "live_gpu: real GPU model server smoke tests; opt-in only",
]

