version: "1"
root: voice_local_indic_kokoro

# Hindi cascaded voice — Indic-Conformer STT + Kokoro Hindi TTS + Ollama LLM.
# Start stack:  local-ai-stack/run-cascade-indic-kokoro.sh
#
#   STT : Indic-Conformer  http://localhost:8001/v1
#   TTS : Kokoro Hindi     http://localhost:8002/v1  (hf_alpha / hm_omega)
#   LLM : Ollama           http://localhost:11434/v1  (qwen, gemma, gpt-oss, …)

storage:
  adapter: memory

agents:
  voice_local_indic_kokoro:
    modality: voice_cascaded
    duplex: full
    stt:
      provider: local
      base_url: ${ENV:NEXUS_STT_BASE_URL|http://localhost:8001/v1}
      model: ${ENV:NEXUS_STT_MODEL|indic-conformer-600m}
      language: ${ENV:NEXUS_STT_LANGUAGE|hi}
      sample_rate: 16000
      api_key: ${ENV:NEXUS_STT_API_KEY|local}
    tts:
      provider: local
      base_url: ${ENV:NEXUS_TTS_BASE_URL|http://localhost:8002/v1}
      model: ${ENV:NEXUS_TTS_MODEL|kokoro}
      voice: ${ENV:NEXUS_TTS_VOICE|hf_alpha}
      audio_format: wav
      sample_rate: ${ENV:NEXUS_TTS_SAMPLE_RATE|24000}
      api_key: ${ENV:NEXUS_TTS_API_KEY|local}
    vad:
      provider: energy
      silence_ms: 600
      sample_rate: 16000
    agent:
      llm:
        provider: openai
        base_url: ${ENV:NEXUS_LLM_BASE_URL|http://localhost:11434/v1}
        model: ${ENV:NEXUS_LLM_MODEL|qwen3:4b}
        api_key: ${ENV:NEXUS_LLM_API_KEY|ollama}
      turns:
        max_turns: 6
      persona:
        role: Hindi Voice Assistant
        goal: Have a natural Hindi spoken conversation and help the user concisely.
        system_prompt: >
          You are a friendly Hindi voice assistant running entirely offline.
          Reply in Hindi (Devanagari) unless the user speaks English.
          Keep replies short — they will be spoken aloud. you name is vidushi
