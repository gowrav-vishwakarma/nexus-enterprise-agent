version: "1"
root: voice_s2s_local

# Real, full-duplex speech-to-speech via a self-hosted Kyutai Moshi server.
# The model runs separately (see local-ai-stack/run-s2s-moshi.sh); the framework
# only opens a local WebSocket. No paid API, no mock.
#
# Swap S2S backends via env (one server at a time on :8998 — see local-ai-stack):
#   NEXUS_S2S_PROVIDER=moshi     + run-s2s-moshi.sh    (English Moshi baseline)
#   NEXUS_S2S_PROVIDER=human-1   + run-s2s-human1.sh   (Hindi Human-1)
#   provider: local            -> OpenAI-Realtime-compatible server

storage:
  adapter: memory

agents:
  voice_s2s_local:
    modality: voice_s2s
    duplex: full
    s2s:
      provider: ${ENV:NEXUS_S2S_PROVIDER|moshi}
      model: ${ENV:NEXUS_S2S_MODEL|moshiko}
      base_url: ${ENV:NEXUS_S2S_BASE_URL|ws://localhost:8998}
      api_key: ${ENV:NEXUS_S2S_API_KEY|local}
    agent:
      # Moshi is audio-native and self-contained, but the agent block is still
      # required (persona/tools apply to S2S models that support bridging).
      llm:
        provider: openai
        base_url: ${ENV:NEXUS_LLM_BASE_URL|http://localhost:11434/v1}
        model: ${ENV:NEXUS_LLM_MODEL|gpt-oss:latest}
        api_key: ${ENV:NEXUS_LLM_API_KEY|ollama}
      persona:
        role: Local Voice Companion
        goal: Have a natural, real-time spoken conversation.
