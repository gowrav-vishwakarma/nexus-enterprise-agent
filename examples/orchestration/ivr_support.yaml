version: "1"
prompts_module: ./ivr_support_prompts.py
root: ivr_support

defaults:
  llm: &default_llm
    provider: openai
    model: ${ENV:OPENAI_MODEL|gpt-4o-mini}
    api_key: ${ENV:OPENAI_API_KEY|mock-key}

storage:
  adapter: memory

plugins:
  ivr_menu: nexus.realtime.tools.ivr.IVRMenuPlugin

# A half-duplex, cascaded voice agent for a phone IVR.
# STT/TTS default to "mock" so the example runs without provider keys; set the
# providers below (deepgram, openai, ...) for real audio.
agents:
  ivr_support:
    modality: voice_cascaded
    duplex: half
    languages:
      allowed: [en, hi]
      default: en
    initial_response:
      mode: ivr
      via_llm: true
      llm_trigger: >-
        The caller just connected. Use play_prompt to present the main menu in
        English. Mention they can press 9 for Hindi (हिंदी).
    # Fixed bilingual script (no LLM) — alternative to via_llm above:
    # initial_response:
    #   mode: ivr
    #   via_llm: false
    #   ivr_script:
    #     - "Welcome. Press 1 for sales, 2 for billing, 3 for support, 9 for Hindi."
    #     - "स्वागत है। बिक्री के लिए 1, बिलिंग के लिए 2, सहायता के लिए 3, हिंदी के लिए 9 दबाएं।"
    stt:
      provider: ${ENV:NEXUS_STT_PROVIDER|mock}
      model: ${ENV:NEXUS_STT_MODEL|nova-3}
      language: en
      api_key: ${ENV:DEEPGRAM_API_KEY|}
    tts:
      provider: ${ENV:NEXUS_TTS_PROVIDER|mock}
      model: ${ENV:NEXUS_TTS_MODEL|tts-1}
      voice: ${ENV:NEXUS_TTS_VOICE|alloy}
      api_key: ${ENV:OPENAI_API_KEY|mock-key}
    vad:
      provider: energy
      silence_ms: 700
    agent:
      llm: *default_llm
      tool_plugins: [ivr_menu]
      turns:
        max_turns: 8
      persona:
        role: IVR Support Agent
        goal: Route callers to the right department quickly and politely
        prompt: ivr_system
