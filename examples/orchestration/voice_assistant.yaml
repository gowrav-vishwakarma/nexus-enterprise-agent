version: "1"
prompts_module: ./voice_assistant_prompts.py
root: voice_assistant

defaults:
  llm: &default_llm
    provider: openai
    model: ${ENV:OPENAI_MODEL|gpt-4o-mini}
    api_key: ${ENV:OPENAI_API_KEY|mock-key}

storage:
  adapter: memory

# A full-duplex (barge-in) browser voice assistant.
# STT/TTS default to "mock" so the example runs without keys; set real providers
# (deepgram / openai) and keys for production audio.
agents:
  voice_assistant:
    modality: voice_cascaded
    duplex: full
    stt:
      provider: ${ENV:NEXUS_STT_PROVIDER|mock}
      model: ${ENV:NEXUS_STT_MODEL|nova-3}
      language: en
      sample_rate: 16000
      api_key: ${ENV:DEEPGRAM_API_KEY|}
    tts:
      provider: ${ENV:NEXUS_TTS_PROVIDER|mock}
      model: ${ENV:NEXUS_TTS_MODEL|tts-1}
      voice: ${ENV:NEXUS_TTS_VOICE|alloy}
      sample_rate: 24000
      api_key: ${ENV:OPENAI_API_KEY|mock-key}
    vad:
      provider: energy
      silence_ms: 600
      sample_rate: 16000
    agent:
      llm: *default_llm
      turns:
        max_turns: 6
      persona:
        role: Voice Assistant
        goal: Have a natural spoken conversation and help the user
        prompt: voice_system
