version: "1"
root: voice_grpc

# Voice agent using Nexus gRPC media servers + liteLLM for LLM.
# Start media servers:  uv run python -m nexus.server up -c examples/servers.yaml
# LLM: external via liteLLM proxy or direct endpoint (not hosted by nexus.server)

servers:
  indic_stt:
    kind: stt
    engine: mock
    port: 50051
  indic_tts:
    kind: tts
    engine: mock
    port: 50052
  silero_vad:
    kind: vad
    engine: mock
    port: 50053

defaults:
  llm_fast: &llm_fast
    provider: litellm
    model: ${ENV:VOICE_LLM_MODEL|ollama/qwen3:4b}
    base_url: ${ENV:LITELLM_BASE_URL|http://localhost:4000}
    api_key: ${ENV:LITELLM_API_KEY|}
    default_params:
      max_tokens: 150
      temperature: 0.7

storage:
  adapter: memory

agents:
  voice_grpc:
    modality: voice_cascaded
    duplex: full
    stt:
      provider: nexus_server
      server_ref: indic_stt
      language: hi
      sample_rate: 16000
    tts:
      provider: nexus_server
      server_ref: indic_tts
      sample_rate: 24000
    vad:
      provider: energy
      silence_ms: 600
    agent:
      llm: *llm_fast
      turns:
        max_turns: 6
      persona:
        role: Hindi Voice Assistant
        goal: Natural spoken Hindi conversation
        system_prompt: >
          Reply in Hindi unless the user speaks English.
          Keep replies short — they will be spoken aloud.
