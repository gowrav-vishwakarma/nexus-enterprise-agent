version: "1"
root: voice_local

# Fully self-hosted / offline-first voice agent (BYOM).
# All three models run locally via the separate `local-ai-stack` servers; the
# framework only sends HTTP to OpenAI-compatible endpoints. No paid APIs.
#
#   LLM : Ollama            http://localhost:11434/v1   (gpt-oss:latest)
#   STT : faster-whisper    http://localhost:8001/v1    (local-ai-stack)
#   TTS : Kokoro            http://localhost:8002/v1    (local-ai-stack)

storage:
  adapter: memory

agents:
  voice_local:
    modality: voice_cascaded
    duplex: full
    stt:
      provider: local                # OpenAI-compatible -> base_url below
      base_url: ${ENV:NEXUS_STT_BASE_URL|http://localhost:8001/v1}
      model: ${ENV:NEXUS_STT_MODEL|whisper-1}
      language: en
      sample_rate: 16000
      api_key: ${ENV:NEXUS_STT_API_KEY|local}
    tts:
      provider: local                # OpenAI-compatible -> base_url below
      base_url: ${ENV:NEXUS_TTS_BASE_URL|http://localhost:8002/v1}
      model: ${ENV:NEXUS_TTS_MODEL|kokoro}
      voice: ${ENV:NEXUS_TTS_VOICE|af_heart}
      audio_format: wav
      sample_rate: 24000
      api_key: ${ENV:NEXUS_TTS_API_KEY|local}
    vad:
      provider: energy
      silence_ms: 600
      sample_rate: 16000
    agent:
      llm:
        provider: openai             # Ollama speaks the OpenAI API at /v1
        base_url: ${ENV:NEXUS_LLM_BASE_URL|http://localhost:11434/v1}
        model: ${ENV:NEXUS_LLM_MODEL|gpt-oss:latest}
        api_key: ${ENV:NEXUS_LLM_API_KEY|ollama}
      turns:
        max_turns: 6
      persona:
        role: Local Voice Assistant
        goal: Have a natural spoken conversation and help the user, concisely.
        system_prompt: >
          You are a friendly local voice assistant running entirely offline.
          Keep replies short and conversational since they will be spoken aloud.
